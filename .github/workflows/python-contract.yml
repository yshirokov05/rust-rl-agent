name: Python contract

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-python-311:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q ai-agent tests scripts/bridge_smoke.py scripts/gather_smoke.py

      - name: Verify bridge smoke CLI loads
        run: |
          python scripts/bridge_smoke.py --help
          python scripts/gather_smoke.py --help

      - name: Run contract tests with zero skips
        shell: pwsh
        run: |
          $output = python -m unittest discover -s tests -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) {
            throw "Unit tests failed with exit code $exitCode."
          }
          if ($output -match "skipped=") {
            throw "Skipped tests are not allowed in the contract job."
          }
          $summary = [string]($output | Select-String -Pattern "Ran ([0-9]+) tests")
          $match = [regex]::Match($summary, "Ran ([0-9]+) tests")
          if (-not $match.Success -or [int]$match.Groups[1].Value -lt 4) {
            throw "Expected at least four contract tests."
          }
